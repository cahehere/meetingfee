<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회비 정산"><link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>모임 회비 정산</title>
<style>
:root{--p:#0f766e;--soft:#e5f4f2;--ink:#17324d;--line:#d7e3e9;--bg:#f4f8fa;--red:#b42318;--green:#087f5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));font-size:16px}
header{background:linear-gradient(135deg,#115e59,#0f766e);color:white;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:1.35rem}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 15px #17324d12}
h2{font-size:1.15rem;margin:0 0 12px}h3{font-size:1rem;margin:18px 0 8px}.muted{color:#607489;font-size:.9rem}.msg{min-height:24px;color:var(--p);font-size:.9rem}.err{color:var(--red)}button,input,select{font:inherit}button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;font-weight:700}button.primary{background:var(--p);color:#fff}button.secondary{background:var(--soft);color:#115e59}button.ghost{background:#fff;border:1px solid var(--line);color:var(--p)}button.danger{color:var(--red)}input,select{width:100%;min-height:46px;border:1px solid #b9cbd5;border-radius:12px;padding:10px 12px;font-size:16px;background:white}label{display:block;font-weight:700;margin:12px 0 6px}.row,.actions{display:flex;gap:8px;align-items:center}.row input{flex:1}.actions{flex-wrap:wrap;margin-top:12px}.actions>*{flex:1;min-width:125px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:13px;padding:11px}.person{display:flex;justify-content:space-between;align-items:center}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:44px}.check input{width:20px;min-height:20px}.empty{text-align:center;color:#607489;background:#f7fafb;padding:16px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--soft);padding:12px;border-radius:12px}.stat strong{display:block;font-size:1.2rem}.balance{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.receive{color:var(--green)}.pay{color:var(--red)}.ok{background:#eef9f2;color:#126b45;padding:12px;border-radius:12px;font-weight:700}.share{width:100%;min-height:140px;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:12px}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#ffffffef;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.tab{background:transparent;color:#607489}.tab.active{background:var(--soft);color:#115e59}.install{display:none}.install.show{display:block}
</style></head><body>
<header><h1>모임 회비 정산</h1><div>별칭으로 간단하고 정확하게 정산해요</div></header><main>
<section id="install" class="card install"><h2>홈 화면에 설치</h2><p id="installText" class="muted"></p><button id="installButton" class="primary">앱 설치</button></section>
<section id="peoplePage" class="card page"><h2>참가자</h2><p class="muted">실명 대신 별칭만 입력하세요.</p><div class="row"><input id="personName" maxlength="30" placeholder="예: 민수"><button id="addPerson" class="primary">추가</button></div><div id="peopleMsg" class="msg"></div><div id="peopleList" class="list"></div><div class="actions"><button id="sample" class="secondary">예제 모임 불러오기</button><button id="clear" class="ghost danger">전체 비우기</button></div></section>
<section id="expensePage" class="card page hidden"><h2>지출</h2><label>항목</label><input id="title" maxlength="50" placeholder="예: 저녁값"><label>낸 사람</label><select id="payer"></select><label>금액(원)</label><input id="amount" inputmode="numeric" pattern="[0-9]*" placeholder="예: 120000"><label>참여자</label><div class="actions"><button id="all" class="ghost">전체 선택</button><button id="none" class="ghost">전체 해제</button></div><div id="checks" class="checks"></div><div id="expenseMsg" class="msg"></div><button id="addExpense" class="primary" style="width:100%">지출 추가</button><h3>지출 목록</h3><div id="expenses" class="list"></div></section>
<section id="settlePage" class="card page hidden"><h2>정산</h2><div id="result"></div><div class="actions"><button id="share" class="primary">결과 공유하기</button></div><div id="shareMsg" class="msg"></div><textarea id="shareText" class="share hidden" readonly></textarea></section></main>
<nav class="tabs"><button class="tab active" data-page="peoplePage">👥<br>참가자</button><button class="tab" data-page="expensePage">🧾<br>지출</button><button class="tab" data-page="settlePage">✅<br>정산</button></nav>
<script>
'use strict';
// 금액은 항상 원 단위 정수로 계산합니다. 나머지 1원은 결제자에게 더합니다.
const KEY='meeting-fee-data-v1';let d=read(),installEvent=null,clearReady=false;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,8),won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function read(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.people)&&Array.isArray(x.expenses))return x}catch(e){}return{people:[],expenses:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}function name(id){return d.people.find(p=>p.id===id)?.name||'알 수 없음'}
function msg(id,t,err){$(id).textContent=t;$(id).className='msg'+(err?' err':'')}
function render(){people();form();expenses();settlement()}
function people(){$('peopleList').innerHTML=d.people.length?d.people.map(p=>'<div class="item person"><span>'+esc(p.name)+'</span><button class="ghost danger" data-delperson="'+p.id+'">삭제</button></div>').join(''):'<div class="empty">아직 참가자가 없습니다.</div>'}
function form(){$('payer').innerHTML=d.people.length?d.people.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join(''):'<option>참가자를 먼저 추가하세요</option>'; $('checks').innerHTML=d.people.length?d.people.map(p=>'<label class="check"><input type="checkbox" value="'+p.id+'">'+esc(p.name)+'</label>').join(''):'<div class="empty">참가자를 먼저 추가하세요.</div>'}
function expenses(){$('expenses').innerHTML=d.expenses.length?d.expenses.map(e=>'<div class="item"><b>'+esc(e.title)+'</b> · '+won(e.amount)+'<br><span class="muted">낸 사람: '+esc(name(e.payerId))+' · 참여: '+esc(e.participantIds.map(name).join(', '))+'</span><br><button class="ghost danger" data-delexpense="'+e.id+'">지출 삭제</button></div>').join(''):'<div class="empty">아직 지출이 없습니다.</div>'}
function calc(){let paid=Object.fromEntries(d.people.map(p=>[p.id,0])),burden=Object.fromEntries(d.people.map(p=>[p.id,0])),total=0;d.expenses.forEach(e=>{total+=e.amount;if(paid[e.payerId]!=null)paid[e.payerId]+=e.amount;let ids=e.participantIds.filter(id=>burden[id]!=null),each=Math.floor(e.amount/ids.length),rest=e.amount-each*ids.length;ids.forEach(id=>burden[id]+=each);if(burden[e.payerId]!=null&&ids.includes(e.payerId))burden[e.payerId]+=rest});let balance=Object.fromEntries(d.people.map(p=>[p.id,paid[p.id]-burden[p.id]]));return{paid,burden,balance,total}}
function transfers(b){let r=Object.entries(b).filter(x=>x[1]>0).map(x=>({id:x[0],a:x[1]})).sort((x,y)=>y.a-x.a),p=Object.entries(b).filter(x=>x[1]<0).map(x=>({id:x[0],a:-x[1]})).sort((x,y)=>y.a-x.a),out=[],i=0,j=0;while(i<r.length&&j<p.length){let a=Math.min(r[i].a,p[j].a);out.push({from:p[j].id,to:r[i].id,a});r[i].a-=a;p[j].a-=a;if(!r[i].a)i++;if(!p[j].a)j++}return out}
function settlement(){if(!d.people.length||!d.expenses.length){$('result').innerHTML='<div class="empty">참가자와 지출을 입력하면 정산 결과가 나타납니다.</div>';return}let c=calc(),ts=transfers(c.balance),receive=Object.values(c.balance).filter(n=>n>0).reduce((a,n)=>a+n,0),pay=Object.values(c.balance).filter(n=>n<0).reduce((a,n)=>a-n,0);let h='<div class="stats"><div class="stat">총 지출<strong>'+won(c.total)+'</strong></div><div class="stat">송금 횟수<strong>'+ts.length+'번</strong></div></div><h3>사람별 결과</h3>';d.people.forEach(p=>{let n=c.balance[p.id];h+='<div class="balance"><span>'+esc(p.name)+'<br><small>낸 '+won(c.paid[p.id])+' · 부담 '+won(c.burden[p.id])+'</small></span><b class="'+(n>=0?'receive':'pay')+'">'+(n>=0?'받기 '+won(n):'보내기 '+won(-n))+'</b></div>'});h+='<h3>송금 안내</h3>'+(ts.length?ts.map(t=>'<div class="item"><b>'+esc(name(t.from))+' → '+esc(name(t.to))+'</b><span style="float:right">'+won(t.a)+'</span></div>').join(''):'<div class="empty">송금할 금액이 없습니다.</div>')+'<p class="ok">받을 금액 합계 '+won(receive)+' = 보낼 금액 합계 '+won(pay)+' = 송금 합계 '+won(ts.reduce((a,t)=>a+t.a,0))+'<br>합계가 맞습니다. 정산이 완료되었습니다.</p>';$('result').innerHTML=h}
function addPerson(){let n=$('personName').value.trim();if(!n)return msg('peopleMsg','별칭을 입력해 주세요.',1);if(d.people.some(p=>p.name===n))return msg('peopleMsg','같은 별칭이 이미 있습니다.',1);d.people.push({id:uid(),name:n});$('personName').value='';save();render();msg('peopleMsg','참가자를 추가했습니다.')}
function addExpense(){let ids=[...document.querySelectorAll('#checks input:checked')].map(x=>x.value),a=Number($('amount').value.replace(/[^0-9]/g,'')),t=$('title').value.trim();if(!t)return msg('expenseMsg','항목을 입력해 주세요.',1);if(!Number.isSafeInteger(a)||a<1)return msg('expenseMsg','금액은 1원 이상의 정수로 입력해 주세요.',1);if(!ids.length)return msg('expenseMsg','참여자를 한 명 이상 선택해 주세요.',1);d.expenses.push({id:uid(),title:t,amount:a,payerId:$('payer').value,participantIds:ids});save();$('title').value='';$('amount').value='';render();msg('expenseMsg','지출을 추가했습니다.')}
function sample(){d.people=['민수','영희','철수','지영','준호','수진'].map(name=>({id:uid(),name}));let q=d.people.map(p=>p.id);d.expenses=[['저녁값',120000,q],['노래방',40000,q.slice(0,3)],['택시비',12000,[q[2],q[3]]],['카페',18000,q.slice(0,4)],['간식',15000,[q[4],q[5],q[0]]],['주차비',10000,[q[0],q[2],q[4],q[5]]]].map((x,i)=>({id:uid(),title:x[0],amount:x[1],payerId:q[i],participantIds:x[2]}));save();render();msg('peopleMsg','예제 모임을 불러왔습니다.')}
function share(){let c=calc(),ts=transfers(c.balance),s=['[모임 회비 정산]','총 지출: '+won(c.total),'','사람별 결과'];d.people.forEach(p=>{let n=c.balance[p.id];s.push(p.name+': '+(n>=0?'받기 ':'보내기 ')+won(Math.abs(n)))});s.push('','송금 안내');ts.forEach(t=>s.push(name(t.from)+' → '+name(t.to)+' '+won(t.a)));s=s.join('\n');$('shareText').value=s;$('shareText').classList.remove('hidden');if(navigator.share)navigator.share({title:'모임 회비 정산',text:s}).then(()=>msg('shareMsg','휴대폰 공유창을 열었습니다.')).catch(e=>{if(e.name!=='AbortError')copy(s)});else copy(s)}function copy(s){navigator.clipboard?.writeText(s).then(()=>msg('shareMsg','공유창을 열 수 없어 클립보드에 복사했습니다.')).catch(()=>{msg('shareMsg','아래 글상자의 내용을 직접 복사해 주세요.',1);$('shareText').select()})}
document.addEventListener('click',e=>{let t=e.target.closest('[data-page]');if(t){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('hidden',p.id!==t.dataset.page));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t))}let p=e.target.closest('[data-delperson]');if(p){if(d.expenses.some(x=>x.payerId===p.dataset.delperson||x.participantIds.includes(p.dataset.delperson)))return msg('peopleMsg','지출에 들어 있는 참가자는 먼저 지출을 삭제해 주세요.',1);if(p.dataset.ready){d.people=d.people.filter(x=>x.id!==p.dataset.delperson);save();render()}else{p.dataset.ready='1';p.textContent='한 번 더 누르면 삭제';setTimeout(()=>{p.dataset.ready='';p.textContent='삭제'},2500)}}let x=e.target.closest('[data-delexpense]');if(x){d.expenses=d.expenses.filter(e=>e.id!==x.dataset.delexpense);save();render()}});
$('addPerson').onclick=addPerson;$('personName').onkeydown=e=>{if(e.key==='Enter')addPerson()};$('addExpense').onclick=addExpense;$('sample').onclick=sample;$('share').onclick=share;$('amount').oninput=e=>e.target.value=e.target.value.replace(/[^0-9]/g,'');$('all').onclick=()=>document.querySelectorAll('#checks input').forEach(x=>x.checked=true);$('none').onclick=()=>document.querySelectorAll('#checks input').forEach(x=>x.checked=false);$('clear').onclick=()=>{if(!clearReady){clearReady=true;$('clear').textContent='한 번 더 누르면 비우기';setTimeout(()=>{clearReady=false;$('clear').textContent='전체 비우기'},2500)}else{d={people:[],expenses:[]};save();render();msg('peopleMsg','모든 기록을 비웠습니다.')}};
let standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone===true,ua=navigator.userAgent.toLowerCase();if(/kakaotalk|line\//.test(ua)&&!standalone){$('install').classList.add('show');$('installText').textContent='앱 안 브라우저에서는 설치가 어려울 수 있어 Safari 또는 Chrome으로 열어 주세요.'}if(/iphone|ipad|ipod/.test(ua)&&!standalone){$('install').classList.add('show');$('installText').textContent='Safari 공유 버튼 → 홈 화면에 추가를 선택하세요.';$('installButton').classList.add('hidden')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('install').classList.add('show');$('installText').textContent='버튼을 눌러 홈 화면에 설치하세요.'});$('installButton').onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null;$('install').classList.remove('show')}};
render();if((location.protocol==='https:'||location.hostname==='localhost')&&'serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
